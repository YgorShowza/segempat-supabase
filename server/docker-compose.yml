# API SEGEMPAT — execução em container apontando para o MySQL corporativo.
# Este arquivo NÃO cria banco de dados: o MySQL é o da empresa.
#
# Uso (na raiz do repositório):
#   cp server/.env.example server/.env   # preencher no servidor, nunca versionar
#   docker compose -f server/docker-compose.yml up -d --build
#
# Passos de banco (executar uma vez, com o .env já preenchido):
#   docker compose -f server/docker-compose.yml run --rm api npm run preflight
#   docker compose -f server/docker-compose.yml run --rm api npm run migrate
#   docker compose -f server/docker-compose.yml run --rm api npm run smoke
#
# Após migration/smoke, o healthcheck do Docker exige /health/ready verde.

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: segempat-api:1.0.0
    container_name: segempat-api
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    # Publique apenas na interface interna; o TLS fica no proxy reverso da empresa.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - segempat-storage:/var/lib/segempat/storage
    # Necessário quando o MySQL corporativo está no host da própria VM.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  segempat-storage:
