# Proxy reverso HTTPS para a API SEGEMPAT.
# Ajuste server_name e certificados conforme o padrão da TI.
# Equivalente em IIS: ARR + URL Rewrite apontando para http://127.0.0.1:8787.

server {
    listen 443 ssl;
    http2 on;
    server_name api.segempat.empresa.local;

    ssl_certificate     /etc/ssl/segempat/fullchain.pem;
    ssl_certificate_key /etc/ssl/segempat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Assinaturas/evidências e PDFs podem trafegar em base64.
    client_max_body_size 10m;

    # Restrição de rede opcional (VPN / faixa corporativa).
    # allow 10.0.0.0/8;
    # deny  all;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Readiness interno do balanceador/orquestrador: só retorna OK quando
    # MySQL, migration/schema e storage privado estão disponíveis.
    location = /health/ready {
        proxy_pass http://127.0.0.1:8787/health/ready;
        access_log off;
    }

    # Liveness simples, útil apenas para diagnóstico do processo HTTP.
    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }
}

server {
    listen 80;
    server_name api.segempat.empresa.local;
    return 301 https://$host$request_uri;
}
