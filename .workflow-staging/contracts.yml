name: SEGEMPAT Contract Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-contract-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run consolidated contract suite
        run: node scripts/run-contract-workflows.mjs
