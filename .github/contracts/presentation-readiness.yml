name: SEGEMPAT Presentation Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  presentation-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate presentation contract
        run: node scripts/check-presentation-readiness.mjs
