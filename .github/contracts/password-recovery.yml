name: SEGEMPAT Password Recovery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-password-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  password-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secure password recovery contract
        shell: bash
        run: |
          set -euo pipefail
          test -f database/mysql/009_secure_password_recovery.sql
          grep -F 'CREATE TABLE password_reset_codes' database/mysql/009_secure_password_recovery.sql >/dev/null
          grep -F 'code_hash VARCHAR(255) NOT NULL' database/mysql/009_secure_password_recovery.sql >/dev/null
          grep -F 'failed_attempts INT NOT NULL DEFAULT 0' database/mysql/009_secure_password_recovery.sql >/dev/null
          grep -F 'CHECK (failed_attempts BETWEEN 0 AND 5)' database/mysql/009_secure_password_recovery.sql >/dev/null
          grep -F 'password_reset_user_fk' database/mysql/009_secure_password_recovery.sql >/dev/null
          grep -F 'password_reset_creator_fk' database/mysql/009_secure_password_recovery.sql >/dev/null

          grep -F '"password_reset_codes"' server/src/app.js >/dev/null
          grep -F '"/reset-password"' server/src/routes/auth.js >/dev/null
          grep -F 'MAX_RESET_CODE_ATTEMPTS = 5' server/src/routes/auth.js >/dev/null
          grep -F 'status AS employee_status' server/src/routes/auth.js >/dev/null
          grep -F 'employee.employee_status !== "Ativo"' server/src/routes/auth.js >/dev/null
          grep -F 'session_epoch = session_epoch + 1' server/src/routes/auth.js >/dev/null
          grep -F 'PASSWORD_RESET' server/src/routes/auth.js >/dev/null
          grep -F 'DELETE FROM password_reset_codes WHERE user_id = ?' server/src/routes/auth.js >/dev/null

          grep -F '"/password-resets/:employeeId"' server/src/routes/access.js >/dev/null
          grep -F 'RESET_CODE_TTL_MINUTES = 30' server/src/routes/access.js >/dev/null
          grep -F 'ISSUE_PASSWORD_RESET_CODE' server/src/routes/access.js >/dev/null
          grep -F 'REVOKE_PASSWORD_RESET_CODE' server/src/routes/access.js >/dev/null

          grep -F 'resetPasswordWithCode' src/lib/backend/auth-gateway.ts >/dev/null
          grep -F '/api/auth/reset-password' src/lib/backend/auth-gateway.ts >/dev/null
          grep -F 'generatePasswordResetCode' src/lib/backend/access-gateway.ts >/dev/null
          grep -F '/api/access/password-resets/' src/lib/backend/access-gateway.ts >/dev/null
          grep -F 'recuperação segura de senha fica disponível no ambiente corporativo' src/lib/backend/auth-gateway.ts >/dev/null
          grep -F 'Esqueci minha senha' src/routes/index.tsx >/dev/null
          grep -F 'Código de recuperação' src/routes/index.tsx >/dev/null
          grep -F 'Redefinir senha' src/components/access/AccessActivationAdmin.tsx >/dev/null
          grep -F 'expira em 30 minutos' src/components/access/AccessActivationAdmin.tsx >/dev/null

          echo "Recuperação segura de senha do SEGEMPAT validada."

      - name: Validate password reset privilege boundary
        run: node scripts/check-password-reset-privilege-boundary.mjs

      - name: Validate password recovery backend syntax
        run: |
          node --check server/src/password-reset-policy.js
          node --check server/src/routes/access.js
          node --check server/src/routes/auth.js
