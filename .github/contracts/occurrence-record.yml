name: SEGEMPAT Occurrence Record

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-occurrence-record-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occurrence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate complete occurrence record contract
        shell: bash
        run: |
          set -euo pipefail
          migration=supabase/migrations/20260913020000_current_hardening.sql
          test -f "$migration"
          grep -F 'people_involved JSONB' "$migration" >/dev/null
          grep -F 'CREATE TABLE occurrence_updates' "$migration" >/dev/null
          grep -F 'CREATE TABLE occurrence_attachments' "$migration" >/dev/null
          grep -F 'occurrences_guard_delete' "$migration" >/dev/null
          grep -F 'occurrences_guard_completed_update' "$migration" >/dev/null
          grep -F 'current_situation' server/src/routes/occurrence-integrity.js >/dev/null
          grep -F 'immediate_risk' server/src/routes/occurrence-integrity.js >/dev/null
          grep -F 'information_source' server/src/routes/occurrence-integrity.js >/dev/null
          grep -F 'actions_taken' server/src/routes/occurrence-integrity.js >/dev/null
          grep -F 'support_required' server/src/routes/occurrence-integrity.js >/dev/null
          grep -F 'OCCURRENCE_EVIDENCE_ADD' server/src/routes/occurrence-integrity.js >/dev/null
          grep -F 'Pessoas envolvidas' src/components/occurrences/OccurrencesWorkspace.tsx >/dev/null
          grep -F 'Registro fotográfico' src/components/occurrences/OccurrencesWorkspace.tsx >/dev/null
          grep -F 'Evolução da ocorrência' src/components/occurrences/OccurrencesWorkspace.tsx >/dev/null
          grep -F 'hasPermission(user, "occurrences.manage")' src/components/occurrences/OccurrencesWorkspace.tsx >/dev/null
          grep -F 'Prioridade operacional' src/components/occurrences/OccurrencesWorkspace.tsx >/dev/null
          grep -F 'Adicionar evidências' src/components/occurrences/OccurrencesWorkspace.tsx >/dev/null
          grep -F 'Limpar filtros' src/components/occurrences/OccurrencesWorkspace.tsx >/dev/null
          if grep -F 'window.confirm' src/components/occurrences/OccurrencesWorkspace.tsx >/dev/null; then
            echo 'Confirmação nativa de exclusão não é permitida no fluxo refinado de ocorrências.' >&2
            exit 1
          fi
          grep -F 'check-occurrence-record-integrity.js' server/package.json >/dev/null || true
          node --check server/src/routes/occurrence-integrity.js
          echo "Registro operacional completo e experiência refinada de ocorrências validados na edição PostgreSQL."
