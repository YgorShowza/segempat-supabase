name: SEGEMPAT Theme Navigation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-theme-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-navigation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate active theme-aware sidebar and desktop navigation
        shell: bash
        run: |
          set -euo pipefail

          LAYOUT="src/components/AppLayoutV2.tsx"
          ROUTE="src/routes/_authenticated/route.tsx"

          grep -F 'import { AppLayoutV2 } from "@/components/AppLayoutV2"' "$ROUTE" >/dev/null
          grep -F '<AppLayoutV2>' "$ROUTE" >/dev/null

          grep -F 'segempat-sidebar-sheet' "$LAYOUT" >/dev/null
          grep -F 'w-[86vw] max-w-[340px]' "$LAYOUT" >/dev/null
          grep -F 'segempat-app-sidebar fixed bottom-0 left-0 top-0 z-40 hidden flex-col lg:flex' "$LAYOUT" >/dev/null
          grep -F 'data-sidebar-collapsed={sidebarCollapsed ? "true" : "false"}' "$LAYOUT" >/dev/null
          grep -F 'const SIDEBAR_COLLAPSED_KEY = "segempat_sidebar_collapsed";' "$LAYOUT" >/dev/null
          grep -F 'function CollapsedNavItems' "$LAYOUT" >/dev/null
          grep -F 'segempat-sidebar-collapse-button' "$LAYOUT" >/dev/null
          grep -F 'PanelLeftClose' "$LAYOUT" >/dev/null
          grep -F 'PanelLeftOpen' "$LAYOUT" >/dev/null
          grep -F 'max-w-[1680px]' "$LAYOUT" >/dev/null
          grep -F 'background: "var(--header-bg)"' "$LAYOUT" >/dev/null
          grep -F 'segempat-sidebar-link-icon' "$LAYOUT" >/dev/null
          grep -F 'segempat-sidebar-link-label' "$LAYOUT" >/dev/null
          grep -F 'segempat-theme-option' "$LAYOUT" >/dev/null
          grep -F 'segempat-sidebar-theme-label' "$LAYOUT" >/dev/null
          grep -F 'window.localStorage.setItem(SIDEBAR_COLLAPSED_KEY' "$LAYOUT" >/dev/null

          grep -F '.segempat-app-shell[data-sidebar-collapsed="true"]' src/styles.css >/dev/null
          grep -F -- '--segempat-sidebar-collapsed-width: 5.25rem;' src/styles.css >/dev/null
          grep -F 'backdrop-filter: blur(22px) saturate(1.06)' src/styles.css >/dev/null
          grep -F '.segempat-sidebar-link--collapsed' src/styles.css >/dev/null
          grep -F '.segempat-sidebar-collapsed-footer' src/styles.css >/dev/null
          grep -F '.segempat-sidebar-wordmark span:last-child' src/styles.css >/dev/null
          grep -F 'color: #e11d3b;' src/styles.css >/dev/null

          if grep -F '.segempat-app-shell[data-sidebar-collapsed="true"]' src/final-experience.css >/dev/null; then
            echo 'ERRO: final-experience voltou a assumir responsabilidade visual da sidebar desktop.' >&2
            exit 1
          fi

          grep -F '.segempat-sidebar-sheet[role="dialog"]' src/theme-contrast-fixes.css >/dev/null
          grep -F 'background: var(--header-bg) !important' src/theme-contrast-fixes.css >/dev/null
          grep -F 'color: var(--text-1) !important' src/theme-contrast-fixes.css >/dev/null
          grep -F '.segempat-app-sidebar .segempat-sidebar-link[data-active="false"]:hover' src/theme-contrast-fixes.css >/dev/null
          grep -F 'background: rgba(255, 255, 255, 0.055) !important' src/theme-contrast-fixes.css >/dev/null

          if grep -F '[class*="w-[280px]"]' src/theme-contrast-fixes.css >/dev/null; then
            echo 'ERRO: proteção de tema não pode depender da largura histórica do drawer.' >&2
            exit 1
          fi

          if grep -F 'rgba(255,255,255,0.62)' "$LAYOUT" >/dev/null; then
            echo 'ERRO: link inativo da sidebar voltou a depender de texto branco fixo.' >&2
            exit 1
          fi

          echo 'AppLayoutV2 ativo: tema claro/escuro e navegação desktop/mobile protegidos.'
