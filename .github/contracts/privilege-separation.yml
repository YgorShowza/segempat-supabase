name: SEGEMPAT Privilege Separation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-privilege-separation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privilege-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate governance and PostgreSQL privilege boundaries
        shell: bash
        run: |
          set -euo pipefail

          # Perfil funcional Inspetor permanece sob controle administrativo protegido.
          grep -F 'Perfil Inspetor é administrado exclusivamente pela TI' server/src/routes/employees.js >/dev/null
          grep -F 'Privilégio de Inspetor, status e identidade privilegiada são administrados exclusivamente pela TI' server/src/routes/employees.js >/dev/null
          grep -F 'Cadastro de Inspetor é administrado exclusivamente pela TI' server/src/routes/employees.js >/dev/null
          grep -F 'linkedLevel === "master"' server/src/routes/employees.js >/dev/null
          grep -F 'session_epoch = session_epoch + 1' server/src/routes/employees.js >/dev/null

          # Concessão/revogação de Inspetor ocorre por utilitário auditável.
          grep -F 'CONFIRM_PRIVILEGED_ACCESS' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'TI_OPERATOR' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'TI_GRANT_INSPECTOR' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'TI_REVOKE_INSPECTOR' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'previousLevel === "master"' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'session_epoch = session_epoch + 1' server/scripts/manage-inspector-access.js >/dev/null

          # Concessão de Administrador Master exige confirmação explícita e auditoria.
          grep -F 'CONFIRM_MASTER_ACCESS' server/scripts/grant-master-access.js >/dev/null
          grep -F 'TI_OPERATOR' server/scripts/grant-master-access.js >/dev/null
          grep -F 'TI_GRANT_MASTER_ACCESS' server/scripts/grant-master-access.js >/dev/null
          grep -F 'session_epoch = session_epoch + 1' server/scripts/grant-master-access.js >/dev/null

          # O modelo granular é a fonte de autoridade da aplicação.
          grep -F 'code: "master", label: "Administrador Master", rank: 100' server/src/authorization.js >/dev/null
          grep -F 'code: "admin", label: "Administrador", rank: 80' server/src/authorization.js >/dev/null
          grep -F 'code: "inspector", label: "Inspetor", rank: 60' server/src/authorization.js >/dev/null
          grep -F 'code: "operator", label: "Operador", rank: 10' server/src/authorization.js >/dev/null
          grep -F 'code: "access.permissions.manage"' server/src/authorization.js >/dev/null
          grep -F 'masterOnly: true' server/src/authorization.js >/dev/null
          grep -F 'if (levelCode === "master") return [...ALL_PERMISSION_CODES]' server/src/authorization.js >/dev/null

          # Sessões e scripts operacionais permanecem protegidos.
          grep -F 'u.session_epoch' server/src/session.js >/dev/null
          grep -F 'credential-version:${passwordHash}:epoch:' server/src/session.js >/dev/null
          grep -F '"manage-inspector-access"' server/package.json >/dev/null
          grep -F '"grant-master-access"' server/package.json >/dev/null
          grep -F '"report-privileged-access"' server/package.json >/dev/null
          grep -F '"migrate": "node scripts/migrate-postgres.js"' server/package.json >/dev/null
          grep -F '"preflight": "node scripts/preflight.js && node scripts/check-runtime-grants.js"' server/package.json >/dev/null

          # Auditoria append-only e governança PostgreSQL.
          migration=supabase/migrations/20260913020000_current_hardening.sql
          grep -F 'audit_logs_block_update' "$migration" >/dev/null
          grep -F 'audit_logs_block_delete' "$migration" >/dev/null
          grep -F 'ADD COLUMN session_epoch BIGINT NOT NULL DEFAULT 0' "$migration" >/dev/null

          # Runtime PostgreSQL deve seguir menor privilégio.
          grep -F 'FROM pg_roles r' server/scripts/check-runtime-grants.js >/dev/null
          grep -F 'r.rolsuper' server/scripts/check-runtime-grants.js >/dev/null
          grep -F 'r.rolcreaterole' server/scripts/check-runtime-grants.js >/dev/null
          grep -F 'r.rolcreatedb' server/scripts/check-runtime-grants.js >/dev/null
          grep -F 'r.rolreplication' server/scripts/check-runtime-grants.js >/dev/null
          grep -F 'r.rolbypassrls' server/scripts/check-runtime-grants.js >/dev/null
          grep -F "has_schema_privilege(current_user, 'public', 'CREATE')" server/scripts/check-runtime-grants.js >/dev/null
          grep -F "has_table_privilege" server/scripts/check-runtime-grants.js >/dev/null
          grep -F 'produção exige role dedicada' server/scripts/check-runtime-grants.js >/dev/null

          # Configuração separa navegador e banco: DATABASE_URL fica somente no backend.
          grep -F 'DATABASE_URL=postgresql://user:CHANGE_ME@host:5432/database' server/.env.example >/dev/null
          grep -F 'POSTGRES_SSL=true' server/.env.example >/dev/null
          test -f .env.supabase.example
          if grep -E '^(DATABASE_URL|POSTGRES_|SEGEMPAT_SESSION_SECRET)=' .env.supabase.example >/dev/null; then
            echo "::error::Frontend Supabase expõe segredo/configuração privada do backend"
            exit 1
          fi

          # A tela de equipe não pode conceder privilégio funcional.
          grep -F 'export const PERFIS = ["Operacional"]' src/lib/employees.ts >/dev/null
          grep -F 'component: TeamManagementWorkspace' src/routes/_authenticated/equipe.tsx >/dev/null
          grep -F 'Inspetor · TI' src/components/team/TeamManagementWorkspace.tsx >/dev/null
          grep -F 'disabled={editingPrivileged}' src/components/team/TeamManagementWorkspace.tsx >/dev/null

          node --check server/src/routes/employees.js
          node --check server/src/session.js
          node --check server/src/authorization.js
          node --check server/scripts/manage-inspector-access.js
          node --check server/scripts/grant-master-access.js
          node --check server/scripts/report-privileged-access.js
          node --check server/scripts/check-runtime-grants.js
          node --check server/scripts/migrate-postgres.js

          echo "Segregação de privilégios, auditoria e menor privilégio PostgreSQL validados."
