name: SEGEMPAT Official Certificate Document

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certificate-document:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate certificate contract
        run: node scripts/check-certificate-document.mjs
      - name: Validate certificate workflow visual shell
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION=src/components/certificates/CertificateValidationWorkspace.tsx
          SIGNATURES=src/components/certificates/ExamSignaturesWorkspace.tsx
          grep -F 'SystemPageHero' "$VALIDATION" >/dev/null
          grep -F 'SystemSurface' "$VALIDATION" >/dev/null
          grep -F 'segempat-document-form' "$VALIDATION" >/dev/null
          grep -F 'SystemPageHero' "$SIGNATURES" >/dev/null
          grep -F 'SystemSurface' "$SIGNATURES" >/dev/null
          grep -F 'segempat-document-record' "$SIGNATURES" >/dev/null
          grep -F 'Governance and certificate workflow convergence' src/styles.css >/dev/null
