name: SEGEMPAT Desktop Experience

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-desktop-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate desktop-first interface contract
        shell: bash
        run: |
          set -euo pipefail
          test -f src/components/AppLayoutV2.tsx
          test -f src/components/dashboard/AdminDashboardV2.tsx
          test -f src/components/team/TeamManagementWorkspace.tsx
          grep -F 'AppLayoutV2' src/routes/_authenticated/route.tsx >/dev/null
          grep -F 'max-w-[1536px]' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'Central de Atenção' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'Painel TV' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F '{priorityCount} em acompanhamento' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'label="Equipe ativa"' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'label="Execução anual"' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          if grep -F '{metrics.activeEmployees} ativos' src/components/dashboard/AdminDashboardV2.tsx >/dev/null; then
            echo "Indicador de equipe ativa voltou a duplicar o card de métricas no hero"; exit 1
          fi
          if grep -F '{metrics.pending} pendentes' src/components/dashboard/AdminDashboardV2.tsx >/dev/null; then
            echo "Indicador de pendências voltou a duplicar o card de métricas no hero"; exit 1
          fi
          grep -F 'const [showGovernance, setShowGovernance] = useState(false);' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'aria-expanded={showGovernance}' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'aria-controls="segempat-master-governance"' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'id="segempat-master-governance"' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'showGovernance ? "grid" : "hidden"' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          for route in /acessos /auditoria /documento-seguranca; do
            grep -F "to=\"$route\"" src/components/dashboard/AdminDashboardV2.tsx >/dev/null || { echo "Atalho de governança ausente: $route"; exit 1; }
          done
          grep -F 'const [showAllQuick, setShowAllQuick] = useState(false);' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'const visibleQuick = showAllQuick ? quick : quick.slice(0, 4);' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F 'aria-expanded={showAllQuick}' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          grep -F '{visibleQuick.map' src/components/dashboard/AdminDashboardV2.tsx >/dev/null
          for route in /equipe /analytics /cronograma /ocorrencias /provas /risco /individual /relatorios; do
            grep -F "to: \"$route\"" src/components/dashboard/AdminDashboardV2.tsx >/dev/null || { echo "Atalho do Dashboard ausente: $route"; exit 1; }
          done
          grep -F 'w-[19rem]' src/components/AppLayoutV2.tsx >/dev/null
          grep -F 'currentLocation' src/components/AppLayoutV2.tsx >/dev/null
          grep -F 'max-h-[62vh]' src/components/team/TeamManagementWorkspace.tsx >/dev/null
          grep -F '<table' src/components/team/TeamManagementWorkspace.tsx >/dev/null
          grep -F 'lg:hidden' src/components/team/TeamManagementWorkspace.tsx >/dev/null
          grep -F 'sm:max-w-2xl' src/components/team/TeamManagementWorkspace.tsx >/dev/null
          grep -F 'max-h-[92dvh]' src/components/ui/dialog.tsx >/dev/null
          grep -F 'focus-visible:ring-2' src/components/ui/button.tsx >/dev/null
          grep -F 'focus-visible:ring-2' src/components/ui/input.tsx >/dev/null
          echo "Experiência desktop-first do SEGEMPAT validada com viewport dinâmica."
