name: SEGEMPAT Operational Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-operational-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operational-desktop-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate operational desktop contract
        shell: bash
        run: |
          set -euo pipefail
          test -f src/operational-desktop.css
          grep -F 'segempat-operational-cronograma' src/components/cronograma/CronogramaPorted.tsx >/dev/null
          grep -F 'segempat-operational-occurrences' src/routes/_authenticated/ocorrencias.tsx >/dev/null
          grep -F 'segempat-operational-provas' src/routes/_authenticated/provas.tsx >/dev/null
          grep -F 'max-width: 1536px' src/operational-desktop.css >/dev/null
          grep -F 'grid-template-columns: repeat(2, minmax(0, 1fr))' src/operational-desktop.css >/dev/null
          grep -F '@media (min-width: 1536px)' src/operational-desktop.css >/dev/null
          grep -F 'operationalDesktopCss from "../operational-desktop.css?url"' src/routes/__root.tsx >/dev/null
          grep -F '{ rel: "stylesheet", href: operationalDesktopCss }' src/routes/__root.tsx >/dev/null
          echo "Experiência operacional desktop do SEGEMPAT validada e carregada globalmente."
