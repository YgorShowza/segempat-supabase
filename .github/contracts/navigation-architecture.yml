name: SEGEMPAT Navigation Architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inspector navigation groups
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/components/AppLayoutV2.tsx
          grep -F 'section: "Operação"' "$FILE" >/dev/null
          grep -F 'section: "Equipe & Desempenho"' "$FILE" >/dev/null
          grep -F 'section: "Capacitação & Avaliação"' "$FILE" >/dev/null
          grep -F 'section: "Análise & Relatórios"' "$FILE" >/dev/null
          grep -F 'section: "Administração & Governança"' "$FILE" >/dev/null
          if grep -F 'section: "Comando Operacional"' "$FILE" >/dev/null || grep -F 'section: "Relatórios & Inteligência"' "$FILE" >/dev/null; then
            echo "Agrupamento legado voltou à navegação"; exit 1
          fi
          grep -F 'const adminPriorityMenu: MenuItem[] = [' "$FILE" >/dev/null
          grep -F 'path: "/admin", label: "Dashboard"' "$FILE" >/dev/null
          grep -F 'path: "/atencao", label: "Central de Atenção"' "$FILE" >/dev/null
          grep -F 'path: "/producao-inspetoria", label: "Produção da Inspetoria"' "$FILE" >/dev/null
          ADMIN_MENU=$(sed -n '/const adminPriorityMenu: MenuItem\[\] = \[/,/const operatorPriorityMenu: MenuItem\[\] = \[/p' "$FILE" | sed '$d')
          for route in /admin /atencao /analytics /equipe /producao-inspetoria /risco /individual /cronograma /ocorrencias /avaliacao-pratica /provas-criar /provas /banco-questoes /modulos-treinamento /ciclos-treinamento /conteudos /assinaturas-provas /validar-certificados /relatorios /ia-base /acessos /auditoria /documento-seguranca; do
            COUNT=$(printf '%s\n' "$ADMIN_MENU" | grep -F -c "path: \"$route\"" || true)
            [ "$COUNT" -eq 1 ] || { echo "Rota deve aparecer exatamente uma vez no menu do Inspetor: $route (encontrado: $COUNT)"; exit 1; }
          done
          grep -F 'label: "Central de Relatórios"' "$FILE" >/dev/null
          if grep -F 'path: "/relatorio-mensal"' "$FILE" >/dev/null; then
            echo "Relatório Mensal voltou a ocupar entrada separada no menu"; exit 1
          fi
          grep -F 'path: "/treinamentos", label: "Academia SEGEMPAT"' "$FILE" >/dev/null
          grep -F 'const operatorPriorityMenu: MenuItem[] = [' "$FILE" >/dev/null
          grep -F 'const operatorSections: MenuSection[] = [' "$FILE" >/dev/null
          grep -F 'section: "Capacitação"' "$FILE" >/dev/null
          grep -F 'section: "Desempenho"' "$FILE" >/dev/null
          grep -F 'section: "Conta"' "$FILE" >/dev/null
          OPERATOR_MENU=$(sed -n '/const operatorPriorityMenu: MenuItem\[\] = \[/,/const operatorMenu: MenuItem\[\] = \[/p' "$FILE" | sed '$d')
          for route in /painel /pendencias /minhas-ocorrencias /treinamentos /provas /conteudos /pratico /progresso /certificados /meu-perfil; do
            COUNT=$(printf '%s\n' "$OPERATOR_MENU" | grep -F -c "path: \"$route\"" || true)
            [ "$COUNT" -eq 1 ] || { echo "Rota deve aparecer exatamente uma vez no menu do Operador: $route (encontrado: $COUNT)"; exit 1; }
          done
          grep -F 'function OperatorNavItems' "$FILE" >/dev/null
          grep -F 'const operatorQuickMenu = operatorMenu.filter' "$FILE" >/dev/null
          for redundant in /teste-rapido /simulador /stress-test /desafio-diario; do
            if grep -F "path: \"$redundant\"" "$FILE" >/dev/null; then
              echo "Ferramenta de prática voltou ao menu principal do Operador: $redundant"; exit 1
            fi
          done
          grep -F 'function AdminNavItems' "$FILE" >/dev/null
          grep -F 'const [openSection, setOpenSection]' "$FILE" >/dev/null
          grep -F 'if (priorityRouteActive)' "$FILE" >/dev/null
          grep -F 'current === section.section ? null : section.section' "$FILE" >/dev/null
          grep -F 'aria-expanded={isOpen}' "$FILE" >/dev/null
          grep -F '<GlobalSearch />' "$FILE" >/dev/null
          echo "Arquitetura de navegação consolidada validada."
