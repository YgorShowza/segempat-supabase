name: SEGEMPAT Inspector Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-inspector-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspector-production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Inspector Production module
        shell: bash
        run: |
          set -euo pipefail
          ROUTE=src/routes/_authenticated/producao-inspetoria.tsx
          UI=src/components/inspector-production/InspectorProductionWorkspace.tsx
          API=server/src/routes/inspector-production.js
          MIG=supabase/migrations/20260928010000_inspector_production.sql
          MIG_RESULT=supabase/migrations/20260928020000_inspector_production_result_status.sql
          MIG_FOLLOW_UP=supabase/migrations/20260928030000_inspector_production_follow_up.sql

          test -f "$ROUTE"
          test -f "$UI"
          test -f "$API"
          test -f "$MIG"
          test -f "$MIG_RESULT"
          test -f "$MIG_FOLLOW_UP"

          grep -F 'Produção da Inspetoria' "$UI" >/dev/null
          grep -F 'Ranking de Execuções Registradas' "$UI" >/dev/null
          grep -F 'Sem evidência' "$UI" >/dev/null
          grep -F 'Cobertura de evidências' "$UI" >/dev/null
          grep -F 'Comparativo com o período anterior' "$UI" >/dev/null
          grep -F 'Produção individual do inspetor' "$UI" >/dev/null
          grep -F 'Concentração por categoria' "$UI" >/dev/null
          grep -F 'Resultado da atribuição' "$UI" >/dev/null
          grep -F 'Desfecho das atribuições' "$UI" >/dev/null
          grep -F 'result_status' "$API" >/dev/null
          grep -F 'RESULT_STATUSES' "$API" >/dev/null
          grep -F "Concluído com pendência" "$MIG_RESULT" >/dev/null
          grep -F "Requer acompanhamento" "$MIG_RESULT" >/dev/null
          grep -F 'NEW.result_status IS DISTINCT FROM OLD.result_status' "$MIG_RESULT" >/dev/null
          grep -F 'parent_entry_id UUID NULL' "$MIG_FOLLOW_UP" >/dev/null
          grep -F 'ON DELETE RESTRICT' "$MIG_FOLLOW_UP" >/dev/null
          grep -F 'NEW.parent_entry_id IS DISTINCT FROM OLD.parent_entry_id' "$MIG_FOLLOW_UP" >/dev/null
          grep -F 'segempat_inspector_production_parent_guard' "$MIG_FOLLOW_UP" >/dev/null
          grep -F "Concluído com pendência" "$MIG_FOLLOW_UP" >/dev/null
          grep -F "Requer acompanhamento" "$MIG_FOLLOW_UP" >/dev/null
          grep -F 'parent_entry_id' "$API" >/dev/null
          grep -F 'FOLLOW_UP_SOURCE_RESULTS' "$API" >/dev/null
          grep -F 'follow_up_chain' "$API" >/dev/null
          grep -F 'follow_up_record: Boolean(parentEntryId)' "$API" >/dev/null
          grep -F 'Registrar acompanhamento' "$UI" >/dev/null
          grep -F 'Cadeia de acompanhamento' "$UI" >/dev/null
          grep -F 'O registro original não será alterado.' "$UI" >/dev/null
          grep -F 'Distribuição por categoria e inspetor' "$UI" >/dev/null
          grep -F 'category_concentration' "$API" >/dev/null
          grep -F 'dominant_share' "$API" >/dev/null
          grep -F 'Ver histórico completo' "$UI" >/dev/null
          grep -F '"/inspectors/:employeeId"' "$API" >/dev/null
          grep -F 'participation_share' "$API" >/dev/null
          grep -F 'previous_period' "$API" >/dev/null
          grep -F 'percentage_change' "$API" >/dev/null
          grep -F 'without_evidence' "$API" >/dev/null
          grep -F 'Filtro de evidência inválido' "$API" >/dev/null
          grep -F 'identity_derived_server_side: true' "$API" >/dev/null
          grep -F 'execution_time_derived_server_side: true' "$API" >/dev/null
          grep -F 'INSPECTOR_PRODUCTION_CREATE' "$API" >/dev/null
          grep -F 'INSPECTOR_PRODUCTION_CANCEL' "$API" >/dev/null
          grep -F 'inspector-production-evidence' "$API" >/dev/null
          grep -F 'Registro de produção pertence ao histórico e não pode ser excluído' "$MIG" >/dev/null
          grep -F "status IN ('Registrada', 'Cancelada')" "$MIG" >/dev/null
          grep -F "'inspector_production.view'" "$MIG" >/dev/null
          grep -F "'inspector_production.record'" "$MIG" >/dev/null
          grep -F '"/producao-inspetoria"' src/lib/access-control.ts >/dev/null
          grep -F '"/producao-inspetoria"' src/routes/_authenticated/route.tsx >/dev/null

          echo "Produção da Inspetoria validada: identidade autenticada, histórico imutável, auditoria, evidência privada e dashboard."
