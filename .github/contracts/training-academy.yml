name: SEGEMPAT Training Academy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-training-academy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate SEGEMPAT Academy
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/components/training/TrainingLibrary.tsx
          ROUTE=src/routes/_authenticated/treinamentos.tsx
          grep -F 'Academia SEGEMPAT' "$FILE" >/dev/null
          grep -F 'Prática & desenvolvimento' "$FILE" >/dev/null
          grep -F 'Começar pela trilha' "$FILE" >/dev/null
          grep -F 'Biblioteca' "$FILE" >/dev/null
          for route in /teste-rapido /simulador /stress-test /desafio-diario /progresso /certificados; do
            grep -F "path=\"$route\"" "$FILE" >/dev/null || { echo "Ferramenta ausente da Academia: $route"; exit 1; }
          done
          grep -F 'Academia SEGEMPAT · SEGEMPAT' "$ROUTE" >/dev/null
          echo "Academia SEGEMPAT validada."
