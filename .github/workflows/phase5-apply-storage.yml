name: Phase 5 Storage Patch

on:
  push:
    branches:
      - supabase/phase-5-private-storage-driver
    paths:
      - .phase5-apply-storage

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply storage patch
        run: node server/scripts/phase5-apply-storage.mjs
      - name: Commit patched sources
        run: |
          git config user.name "SEGEMPAT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add private Supabase storage driver"
          git push origin HEAD:supabase/phase-5-private-storage-driver
