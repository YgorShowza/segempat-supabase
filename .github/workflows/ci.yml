name: SEGEMPAT CI

on:
  push:
    branches: [main, supabase/phase-1-foundation]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize dependency registries
        run: node scripts/normalize-package-registries.mjs

      - name: Enforce API-owned Supabase architecture
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          test ! -d src/integrations/supabase
          test ! -d .lovable
          grep -F '"@cloudflare/vite-plugin"' package.json >/dev/null
          grep -F '"wrangler"' package.json >/dev/null
          grep -F 'cloudflare({ viteEnvironment: { name: "ssr" } })' vite.config.ts >/dev/null
          grep -F '"main": "@tanstack/react-start/server-entry"' wrangler.jsonc >/dev/null
          grep -F '"nodejs_compat"' wrangler.jsonc >/dev/null
          grep -F 'VITE_SEGEMPAT_API_URL' src/lib/backend/api-client.ts >/dev/null
          grep -F 'VITE_SEGEMPAT_REQUIRE_API' src/lib/backend/api-client.ts >/dev/null
          if grep -RInE --exclude-dir=node_modules --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' --exclude='bun.lock' '(@supabase/supabase-js|createClient\(|SUPABASE_SERVICE_ROLE|SUPABASE_ANON_KEY)' src package.json vite.config.ts 2>/dev/null; then
            echo "::error::Frontend contém acesso Supabase direto; a edição exige Frontend -> API SEGEMPAT -> PostgreSQL"
            exit 1
          fi
          echo "Arquitetura API-owned da edição Supabase validada."

      - name: Validate PostgreSQL migration versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::Nenhuma migration PostgreSQL encontrada em supabase/migrations"
            exit 1
          fi
          bad=0
          versions=()
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "::error::Migration PostgreSQL com nome inválido: $file"
              bad=1
              continue
            fi
            versions+=("${file%%_*}")
          done
          duplicates=$(printf '%s\n' "${versions[@]}" | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "::error::Versões PostgreSQL duplicadas: $duplicates"
            bad=1
          fi
          [[ "$bad" -eq 0 ]]
          echo "Migrations PostgreSQL verificadas: ${#files[@]} arquivo(s)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        run: npm ci --prefix server --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Validate PostgreSQL API syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find server/src server/scripts -type f -name '*.js' | sort)
          echo "Sintaxe da API PostgreSQL validada."

      - name: Validate production PostgreSQL configuration
        shell: bash
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://segempat_ci:ci-password-only@db.example.test:5432/segempat
          POSTGRES_SSL: "true"
          POSTGRES_POOL_SIZE: "5"
          SEGEMPAT_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
          SEGEMPAT_SESSION_SECURE: "true"
          SEGEMPAT_SESSION_SAMESITE: lax
          SEGEMPAT_ALLOWED_ORIGINS: https://segempat.example.test
          SEGEMPAT_STORAGE_DRIVER: filesystem
          SEGEMPAT_STORAGE_PATH: /tmp/segempat-ci-storage
          SEGEMPAT_TIMEZONE: America/Maceio
        run: |
          set -euo pipefail
          mkdir -p "$SEGEMPAT_STORAGE_PATH"
          node --input-type=module <<'NODE'
          const { config } = await import('./server/src/config.js');
          if (config.nodeEnv !== 'production') process.exit(1);
          if (!config.db.ssl || !config.db.url.startsWith('postgresql://')) process.exit(1);
          if (config.storage.driver !== 'filesystem' || config.allowedOrigins.length !== 1) process.exit(1);
          console.log('Configuração de produção PostgreSQL validada.');
          NODE

      - name: Reject unsafe production configuration
        shell: bash
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://segempat_ci:ci-password-only@db.example.test:5432/segempat
          POSTGRES_SSL: "true"
          POSTGRES_POOL_SIZE: "5"
          SEGEMPAT_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
          SEGEMPAT_SESSION_SECURE: "true"
          SEGEMPAT_SESSION_SAMESITE: lax
          SEGEMPAT_ALLOWED_ORIGINS: https://segempat.example.test
          SEGEMPAT_STORAGE_DRIVER: filesystem
          SEGEMPAT_STORAGE_PATH: /tmp/segempat-ci-storage
          SEGEMPAT_TIMEZONE: America/Maceio
        run: |
          set -euo pipefail
          expect_rejected() {
            description="$1"
            shift
            if env "$@" node --input-type=module -e "await import('./server/src/config.js')" >/tmp/segempat-config-negative.log 2>&1; then
              cat /tmp/segempat-config-negative.log
              echo "::error::Configuração insegura foi aceita: $description"
              exit 1
            fi
            echo "Rejeição confirmada: $description"
          }
          expect_rejected "cookie sem Secure em produção" SEGEMPAT_SESSION_SECURE=false
          expect_rejected "origem HTTP em produção" SEGEMPAT_ALLOWED_ORIGINS=http://segempat.example.test
          expect_rejected "storage relativo em produção" SEGEMPAT_STORAGE_PATH=./storage
          expect_rejected "timezone inválida" SEGEMPAT_TIMEZONE=Invalid/Timezone
          expect_rejected "connection string placeholder" DATABASE_URL=postgresql://user:change_me@host:5432/database
          expect_rejected "connection string não PostgreSQL" DATABASE_URL=mysql://user:pass@host:3306/database
          expect_rejected "TLS PostgreSQL desabilitado em produção" POSTGRES_SSL=false
          expect_rejected "CA PostgreSQL com TLS desabilitado" POSTGRES_SSL=false POSTGRES_SSL_CA_PATH=/tmp/postgres-ca.pem
          expect_rejected "CA PostgreSQL relativa em produção" POSTGRES_SSL=true POSTGRES_SSL_CA_PATH=./postgres-ca.pem
          expect_rejected "segredo de sessão placeholder" SEGEMPAT_SESSION_SECRET=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32_BYTES_MINIMUM

      - name: Validate API security contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'app.use("/api", enforceTrustedWriteOrigin);' server/src/app.js >/dev/null
          grep -F 'ORIGIN_REQUIRED' server/src/app.js >/dev/null
          grep -F 'express.json({ limit: "2mb", type: "application/json" })' server/src/app.js >/dev/null
          if grep -F 'express.urlencoded' server/src/app.js >/dev/null; then
            echo "::error::API não deve aceitar parser URL-encoded"
            exit 1
          fi
          grep -F 'sessionVersion' server/src/session.js >/dev/null
          grep -F 'consumeAuthAttempt' server/src/routes/auth.js >/dev/null
          grep -F 'SENHA_STDIN' server/scripts/bootstrap-admin.js >/dev/null
          grep -Eq '^POSTGRES_SSL_CA_PATH=$' server/.env.example
          grep -F 'withTransaction' server/src/routes/cronograma-import.js >/dev/null
          echo "Contratos de sessão, origem confiável e transação validados."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build in API-only mode
        env:
          VITE_SEGEMPAT_API_URL: https://segempat-api.example.test
          VITE_SEGEMPAT_REQUIRE_API: "true"
        run: bun run build
