name: TEMP Refresh SEGEMPAT Server Dependencies

on:
  push:
    branches: [security-refresh-server-deps]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-refresh-server-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh patched server dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd server
          npm install express@4.22.3 cookie-parser@1.4.7 --save-exact --ignore-scripts --registry=https://registry.npmjs.org/
          npm audit --json > /tmp/segempat-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/segempat-audit.json','utf8'));
          console.log('Audit vulnerabilities:', JSON.stringify(audit.metadata?.vulnerabilities || {}));
          NODE
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes."
            exit 0
          fi
          git commit -m "Refresh patched server dependencies"
          git push origin HEAD:security-refresh-server-deps
