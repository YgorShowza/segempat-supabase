name: Validate PostgreSQL migration chain

on:
  push:
    branches:
      - supabase/phase-1-foundation
    paths:
      - 'scripts/generate-postgres-baseline.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/generate-postgres-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: segempat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d segempat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout Supabase edition branch
        uses: actions/checkout@v4
        with:
          ref: supabase/phase-1-foundation
          fetch-depth: 0

      - name: Regenerate API-owned baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-postgres-baseline.mjs

      - name: Validate complete migration chain on PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test "${#migrations[@]}" -gt 0
          for migration in "${migrations[@]}"; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U postgres -d segempat_test -v ON_ERROR_STOP=1 -f "$migration"
          done

          table_count=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")
          echo "Public tables: ${table_count}"
          test "$table_count" -ge 27

          psql -h 127.0.0.1 -U postgres -d segempat_test -v ON_ERROR_STOP=1 -c \
            "SELECT code, rank_value FROM access_levels ORDER BY rank_value DESC;"
          psql -h 127.0.0.1 -U postgres -d segempat_test -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) AS permissions FROM access_permissions;"

      - name: Commit regenerated baseline if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260913010000_api_owned_baseline.sql
          if git diff --cached --quiet; then
            echo "Baseline já está atualizado."
            exit 0
          fi
          git commit -m "Regenerate API-owned PostgreSQL baseline"
          git push origin HEAD:supabase/phase-1-foundation
