name: SEGEMPAT Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite PUBLICAR para confirmar o deploy de produção'
        required: true
        type: string

concurrency:
  group: segempat-supabase-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Production Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Public deployment identifiers/URLs. No backend secret is exposed here.
      CLOUDFLARE_ACCOUNT_ID: '2e32d007ae7b8b4f488f4f9a301325d5'
      VITE_SEGEMPAT_API_URL: 'https://segempat-api-supabase.onrender.com'
      VITE_SEGEMPAT_REQUIRE_API: 'true'

    steps:
      - name: Require explicit production authorization
        shell: bash
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ "$DEPLOY_CONFIRMATION" != "PUBLICAR" ]; then
            echo "Deploy bloqueado: confirmação explícita ausente."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Deploy bloqueado: CLOUDFLARE_API_TOKEN não configurado no environment production deste repositório."
            exit 1
          fi

          case "$VITE_SEGEMPAT_API_URL" in
            https://*) ;;
            *)
              echo "Deploy bloqueado: a API da edição Supabase deve usar HTTPS."
              exit 1
              ;;
          esac

          case "$VITE_SEGEMPAT_API_URL" in
            *localhost*|*127.0.0.1*|*.example|*.example/*|*.example.test*|*example.test*)
              echo "Deploy bloqueado: URL de API de teste/localhost não pode ser usada em produção."
              exit 1
              ;;
          esac

          echo "Autorização e configuração mínima da edição Supabase validadas."

      - name: Checkout approved main
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Normalize dependency registries
        run: node scripts/normalize-package-registries.mjs

      - name: Install dependencies from official npm registry
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org

      - name: Build Supabase edition frontend
        run: bun run build

      - name: Validate Cloudflare package before upload
        run: bunx wrangler deploy --dry-run --outdir .wrangler-production-dry-run

      - name: Deploy approved Supabase edition main to Cloudflare
        run: bunx wrangler deploy
