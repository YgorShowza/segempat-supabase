name: SEGEMPAT MySQL Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-mysql-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: segempat_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      NODE_ENV: test
      PORT: 8787
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: segempat_ci
      MYSQL_USER: segempat_runtime
      MYSQL_PASSWORD: runtime-ci-password
      MYSQL_SSL: "false"
      MYSQL_POOL_SIZE: 5
      SEGEMPAT_SESSION_SECRET: mysql-integration-session-secret-with-at-least-32-bytes
      SEGEMPAT_SESSION_COOKIE: segempat_integration_session
      SEGEMPAT_SESSION_TTL_HOURS: 1
      SEGEMPAT_SESSION_SECURE: "false"
      SEGEMPAT_SESSION_SAMESITE: lax
      SEGEMPAT_ALLOWED_ORIGINS: http://127.0.0.1:4173
      SEGEMPAT_STORAGE_DRIVER: filesystem
      SEGEMPAT_STORAGE_PATH: /tmp/segempat-mysql-integration-storage
      SEGEMPAT_TIMEZONE: America/Maceio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize dependency registries
        run: node scripts/normalize-package-registries.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install API dependencies from official npm registry
        run: npm ci --prefix server --ignore-scripts --registry=https://registry.npmjs.org/ --replace-registry-host=always

      - name: Prepare integration storage
        run: mkdir -p "$SEGEMPAT_STORAGE_PATH"

      - name: Configure trigger policy and least-privilege identities
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import mysql from 'mysql2/promise';

          const connection = await mysql.createConnection({
            host: '127.0.0.1',
            port: 3306,
            user: 'root',
            password: 'ci-root-password',
          });
          try {
            // O SEGEMPAT usa triggers de integridade/auditoria. Com binary log ativo,
            // MySQL exige SUPER para criá-los quando esta política é 0. O ambiente
            // descartável modela a configuração corporativa segura que permite à
            // credencial de migration permanecer restrita ao schema da aplicação.
            await connection.query('SET GLOBAL log_bin_trust_function_creators = 1');
            const [policyRows] = await connection.query('SELECT @@GLOBAL.log_bin_trust_function_creators AS trusted');
            if (Number(policyRows?.[0]?.trusted) !== 1) {
              throw new Error('log_bin_trust_function_creators não foi habilitado no MySQL descartável');
            }

            await connection.query("CREATE USER IF NOT EXISTS 'segempat_runtime'@'%' IDENTIFIED BY 'runtime-ci-password'");
            await connection.query("CREATE USER IF NOT EXISTS 'segempat_migration'@'%' IDENTIFIED BY 'migration-ci-password'");
            await connection.query("GRANT SELECT, INSERT, UPDATE, DELETE ON `segempat_ci`.* TO 'segempat_runtime'@'%'");
            await connection.query("GRANT ALL PRIVILEGES ON `segempat_ci`.* TO 'segempat_migration'@'%'");
            await connection.query('FLUSH PRIVILEGES');
          } finally {
            await connection.end();
          }
          console.log('Política de triggers e identidades MySQL de integração preparadas.');
          NODE

      - name: Run preflight against real MySQL 8
        run: npm --prefix server run preflight

      - name: Apply all migrations against real MySQL 8
        env:
          MYSQL_MIGRATION_USER: segempat_migration
          MYSQL_MIGRATION_PASSWORD: migration-ci-password
        run: npm --prefix server run migrate

      - name: Run full MySQL smoke suite
        run: npm --prefix server run smoke

      - name: Verify API readiness against migrated MySQL
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node src/index.js >/tmp/segempat-mysql-integration-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health/ready >/tmp/segempat-ready.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/segempat-mysql-integration-api.log || true
            echo "::error::API não atingiu readiness contra o MySQL descartável"
            exit 1
          fi

          cat /tmp/segempat-ready.json
          grep -F '"ok":true' /tmp/segempat-ready.json >/dev/null
          grep -F '"database":"connected"' /tmp/segempat-ready.json >/dev/null
          grep -F '"schema":"ready"' /tmp/segempat-ready.json >/dev/null
          grep -F '"storage":"ready"' /tmp/segempat-ready.json >/dev/null
          grep -F '"version":"010"' /tmp/segempat-ready.json >/dev/null
          echo "API SEGEMPAT validada contra MySQL 8 real descartável até a migration 010."
