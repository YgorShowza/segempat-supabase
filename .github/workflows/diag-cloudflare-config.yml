name: SEGEMPAT Cloudflare Config Diagnostic

on:
  push:
    branches:
      - diag-cloudflare-config

jobs:
  diagnostic:
    name: Check production Cloudflare configuration presence
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SEGEMPAT_API_URL: ${{ vars.VITE_SEGEMPAT_API_URL }}
    steps:
      - name: Report configuration presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "CLOUDFLARE_API_TOKEN=configured"; else echo "CLOUDFLARE_API_TOKEN=missing"; fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "CLOUDFLARE_ACCOUNT_ID=configured"; else echo "CLOUDFLARE_ACCOUNT_ID=missing"; fi
          if [ -n "${VITE_SEGEMPAT_API_URL:-}" ]; then echo "VITE_SEGEMPAT_API_URL=configured"; else echo "VITE_SEGEMPAT_API_URL=missing"; fi

  hosted-readiness:
    name: Verify hosted API with temporary trusted origin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEGEMPAT_HOSTED_API_URL: https://segempat-api-supabase.onrender.com
      SEGEMPAT_HOSTED_TRUSTED_ORIGIN: https://segempat-api-supabase.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run hosted readiness gate
        run: node server/scripts/hosted-readiness.js
