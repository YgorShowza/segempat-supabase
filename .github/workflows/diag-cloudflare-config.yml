name: SEGEMPAT Production Frontend Smoke

on:
  push:
    branches:
      - diag-cloudflare-config

jobs:
  smoke:
    name: Verify production Worker responds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Request production Worker
        shell: bash
        run: |
          set -euo pipefail
          url='https://segempat-supabase.ygoxxx.workers.dev/'
          status=$(curl -sS -L -o /tmp/segempat.html -w '%{http_code}' "$url")
          echo "HTTP $status"
          test "$status" = '200'
          test -s /tmp/segempat.html
          grep -Eqi '<!doctype html|<html|SEGEMPAT' /tmp/segempat.html
          echo 'SEGEMPAT production Worker smoke approved.'
