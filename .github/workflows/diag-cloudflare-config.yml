name: SEGEMPAT Cloudflare Config Diagnostic

on:
  push:
    branches:
      - diag-cloudflare-config

jobs:
  diagnostic:
    name: Check production Cloudflare configuration presence
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SEGEMPAT_API_URL: ${{ vars.VITE_SEGEMPAT_API_URL }}
    steps:
      - name: Report configuration presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "CLOUDFLARE_API_TOKEN=configured"; else echo "CLOUDFLARE_API_TOKEN=missing"; fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "CLOUDFLARE_ACCOUNT_ID=configured"; else echo "CLOUDFLARE_ACCOUNT_ID=missing"; fi
          if [ -n "${VITE_SEGEMPAT_API_URL:-}" ]; then echo "VITE_SEGEMPAT_API_URL=configured"; else echo "VITE_SEGEMPAT_API_URL=missing"; fi
