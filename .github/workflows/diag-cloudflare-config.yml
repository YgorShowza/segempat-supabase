name: SEGEMPAT Final Hosted Readiness

on:
  push:
    branches:
      - diag-cloudflare-config

jobs:
  hosted-readiness:
    name: Verify hosted API against production Worker origin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEGEMPAT_HOSTED_API_URL: https://segempat-api-supabase.onrender.com
      SEGEMPAT_HOSTED_TRUSTED_ORIGIN: https://segempat-supabase.ygoxxx.workers.dev
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run final hosted readiness gate
        run: node server/scripts/hosted-readiness.js
