name: SEGEMPAT Cloudflare One-Shot Production Deploy

on:
  push:
    branches:
      - diag-cloudflare-config

jobs:
  deploy:
    name: Deploy approved main to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '2e32d007ae7b8b4f488f4f9a301325d5'
      VITE_SEGEMPAT_API_URL: 'https://segempat-api-supabase.onrender.com'
      VITE_SEGEMPAT_REQUIRE_API: 'true'
    steps:
      - name: Verify protected token is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 1; }
          echo 'Cloudflare token present; non-secret deployment configuration loaded.'

      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Normalize dependency registries
        run: node scripts/normalize-package-registries.mjs

      - name: Install dependencies from official npm registry
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org

      - name: Build Supabase edition frontend
        run: bun run build

      - name: Validate Cloudflare package before upload
        run: bunx wrangler deploy --dry-run --outdir .wrangler-production-dry-run

      - name: Deploy approved Supabase edition main to Cloudflare
        run: bunx wrangler deploy
