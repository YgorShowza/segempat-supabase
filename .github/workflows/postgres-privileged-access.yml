name: PostgreSQL Privileged Access

on:
  push:
    branches:
      - supabase/phase-1-foundation
    paths:
      - 'server/scripts/bootstrap-admin.js'
      - 'server/scripts/grant-master-access.js'
      - 'server/scripts/manage-inspector-access.js'
      - 'server/scripts/report-privileged-access.js'
      - 'server/src/db.js'
      - 'server/src/config.js'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'supabase/migrations/**'
      - '.github/workflows/postgres-privileged-access.yml'
  pull_request:
    paths:
      - 'server/scripts/bootstrap-admin.js'
      - 'server/scripts/grant-master-access.js'
      - 'server/scripts/manage-inspector-access.js'
      - 'server/scripts/report-privileged-access.js'
      - 'server/src/db.js'
      - 'server/src/config.js'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'supabase/migrations/**'
      - '.github/workflows/postgres-privileged-access.yml'
  workflow_dispatch:

jobs:
  privileged-access-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: segempat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d segempat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/segempat_test
      POSTGRES_SSL: 'false'
      POSTGRES_POOL_SIZE: '5'
      SEGEMPAT_SESSION_SECRET: ci-postgres-session-secret-with-at-least-32-bytes
      SEGEMPAT_SESSION_SECURE: 'false'
      SEGEMPAT_SESSION_SAMESITE: lax
      SEGEMPAT_ALLOWED_ORIGINS: http://127.0.0.1:4173
      SEGEMPAT_STORAGE_DRIVER: filesystem
      SEGEMPAT_STORAGE_PATH: /tmp/segempat-postgres-storage
      SEGEMPAT_TIMEZONE: America/Maceio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        run: npm ci --prefix server --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Apply PostgreSQL migrations
        run: npm run migrate --prefix server

      - name: Bootstrap isolated Master through official utility
        working-directory: server
        env:
          CONFIRM_BOOTSTRAP_ADMIN: SIM
          MATRICULA: ci-bootstrap-master
          NOME: SEGEMPAT CI Bootstrap Master
          SETOR: Administrativo
          SENHA: Ci-Bootstrap-Postgres-123!
        run: node scripts/bootstrap-admin.js

      - name: Verify bootstrap result and seed isolated operator
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import bcrypt from 'bcryptjs';
          import pg from 'pg';
          const { Pool } = pg;
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, ssl: false });
          const master = await pool.query(
            `SELECT u.id, u.session_epoch, e.access_profile, ual.level_code,
                    EXISTS (SELECT 1 FROM user_roles r WHERE r.user_id=u.id AND r.role='admin') AS admin_role
               FROM app_users u
               JOIN employees e ON lower(trim(e.matricula))=lower(trim(u.matricula))
               JOIN user_access_levels ual ON ual.user_id=u.id
              WHERE u.matricula='ci-bootstrap-master'`,
          );
          const row = master.rows[0];
          if (!row || row.level_code !== 'master' || row.access_profile !== 'Inspetor' || !row.admin_role) {
            throw new Error(`Bootstrap Master inconsistente: ${JSON.stringify(row)}`);
          }
          const audit = await pool.query(
            `SELECT count(*)::int AS total FROM audit_logs WHERE action='BOOTSTRAP_ADMIN' AND entity_id=$1::text`,
            [row.id],
          );
          if (audit.rows[0].total !== 1) throw new Error('Bootstrap não registrou auditoria única');

          const employeeId = randomUUID();
          const userId = randomUUID();
          const passwordHash = await bcrypt.hash('not-used-in-this-flow', 10);
          await pool.query('BEGIN');
          try {
            await pool.query(
              `INSERT INTO employees (id,full_name,matricula,sector,access_profile,status,level,points,first_access)
               VALUES ($1,'SEGEMPAT CI Operator','ci-priv-operator','CFTV','Operacional','Ativo',1,0,0)`,
              [employeeId],
            );
            await pool.query(
              `INSERT INTO app_users (id,matricula,password_hash,status,session_epoch)
               VALUES ($1,'ci-priv-operator',$2,'Ativo',0)`,
              [userId, passwordHash],
            );
            await pool.query(
              `INSERT INTO profiles (id,matricula,nome) VALUES ($1,'ci-priv-operator','SEGEMPAT CI Operator')`,
              [userId],
            );
            await pool.query(
              `INSERT INTO user_access_levels (user_id,level_code,updated_by) VALUES ($1,'operator',NULL)`,
              [userId],
            );
            await pool.query('COMMIT');
          } catch (error) {
            await pool.query('ROLLBACK');
            throw error;
          } finally {
            await pool.end();
          }
          NODE

      - name: Grant Inspector through official utility
        working-directory: server
        env:
          CONFIRM_PRIVILEGED_ACCESS: SIM
          ACTION: GRANT
          MATRICULA: ci-priv-operator
          TI_OPERATOR: GitHub Actions CI
        run: node scripts/manage-inspector-access.js

      - name: Verify Inspector grant
        shell: bash
        run: |
          set -euo pipefail
          level=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT ual.level_code FROM user_access_levels ual JOIN app_users u ON u.id=ual.user_id WHERE u.matricula='ci-priv-operator'")
          profile=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT e.access_profile FROM employees e WHERE e.matricula='ci-priv-operator'")
          admin_role=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT count(*) FROM user_roles r JOIN app_users u ON u.id=r.user_id WHERE u.matricula='ci-priv-operator' AND r.role='admin'")
          epoch=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT session_epoch FROM app_users WHERE matricula='ci-priv-operator'")
          audit=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT count(*) FROM audit_logs al JOIN employees e ON al.entity_id=e.id::text WHERE e.matricula='ci-priv-operator' AND al.action='TI_GRANT_INSPECTOR'")
          test "$level" = 'inspector'
          test "$profile" = 'Inspetor'
          test "$admin_role" = '1'
          test "$epoch" = '1'
          test "$audit" = '1'

      - name: Revoke Inspector through official utility
        working-directory: server
        env:
          CONFIRM_PRIVILEGED_ACCESS: SIM
          ACTION: REVOKE
          MATRICULA: ci-priv-operator
          TI_OPERATOR: GitHub Actions CI
        run: node scripts/manage-inspector-access.js

      - name: Verify Inspector revoke
        shell: bash
        run: |
          set -euo pipefail
          level=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT ual.level_code FROM user_access_levels ual JOIN app_users u ON u.id=ual.user_id WHERE u.matricula='ci-priv-operator'")
          profile=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT e.access_profile FROM employees e WHERE e.matricula='ci-priv-operator'")
          admin_role=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT count(*) FROM user_roles r JOIN app_users u ON u.id=r.user_id WHERE u.matricula='ci-priv-operator' AND r.role='admin'")
          epoch=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT session_epoch FROM app_users WHERE matricula='ci-priv-operator'")
          audit=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT count(*) FROM audit_logs al JOIN employees e ON al.entity_id=e.id::text WHERE e.matricula='ci-priv-operator' AND al.action='TI_REVOKE_INSPECTOR'")
          test "$level" = 'operator'
          test "$profile" = 'Operacional'
          test "$admin_role" = '0'
          test "$epoch" = '2'
          test "$audit" = '1'

      - name: Grant Master through official utility
        working-directory: server
        env:
          CONFIRM_MASTER_ACCESS: SIM
          MATRICULA: ci-priv-operator
          TI_OPERATOR: GitHub Actions CI
        run: node scripts/grant-master-access.js

      - name: Verify Master grant and privileged report
        shell: bash
        run: |
          set -euo pipefail
          level=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT ual.level_code FROM user_access_levels ual JOIN app_users u ON u.id=ual.user_id WHERE u.matricula='ci-priv-operator'")
          admin_role=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT count(*) FROM user_roles r JOIN app_users u ON u.id=r.user_id WHERE u.matricula='ci-priv-operator' AND r.role='admin'")
          epoch=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT session_epoch FROM app_users WHERE matricula='ci-priv-operator'")
          audit=$(psql -h 127.0.0.1 -U postgres -d segempat_test -Atc "SELECT count(*) FROM audit_logs al JOIN app_users u ON al.entity_id=u.id::text WHERE u.matricula='ci-priv-operator' AND al.action='TI_GRANT_MASTER_ACCESS'")
          test "$level" = 'master'
          test "$admin_role" = '1'
          test "$epoch" = '3'
          test "$audit" = '1'
          npm run report-privileged-access --prefix server
