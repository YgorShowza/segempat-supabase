name: Import SEGEMPAT source snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.bootstrap'
      - '.github/workflows/import-source-snapshot.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone exact corporate-ready source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/segempat-source
          git clone --no-tags https://github.com/YgorShowza/app-reimagined.git /tmp/segempat-source
          git -C /tmp/segempat-source checkout cc8e20022645114502d5eb87bbcf2d6bee77a44f

      - name: Import source tree except workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/import-workflow
          cp "$GITHUB_WORKSPACE/.github/workflows/import-source-snapshot.yml" /tmp/import-workflow/import-source-snapshot.yml

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github/workflows/***' /tmp/segempat-source/ "$GITHUB_WORKSPACE"/

          mkdir -p "$GITHUB_WORKSPACE/.github/workflows"
          cp /tmp/import-workflow/import-source-snapshot.yml "$GITHUB_WORKSPACE/.github/workflows/import-source-snapshot.yml"

          git add -A
          git commit -m "Import SEGEMPAT snapshot cc8e200 from app-reimagined"
          git push origin HEAD:main
